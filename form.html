<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/form.js"></script>
    <meta name="description" content="WDD 131 – Produce review page with a drop down and multiple kinds of buttons.">
    <meta name="author" content="Bryan Borst">
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                 <input type="radio" id="r1" name="rating" value="1" required>
                    <label for="r1">☆</label>

                <input type="radio" id="r2" name="rating" value="2">
  v                 <label for="r2">☆☆</label>

                <input type="radio" id="r3" name="rating" value="3">
                    <label for="r3">☆☆☆</label>

                <input type="radio" id="r4" name="rating" value="4">
                    <label for="r4">☆☆☆☆</label>

                <input type="radio" id="r5" name="rating" value="5">
                    <label for="r5">☆☆☆☆☆</label>

            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
            
                <input type="checkbox" id="f1" name="features[]" value="durability">
                <label for="f1">Durability</label>
            
                <input type="checkbox" id="f2" name="features[]" value="ease">
                <label for="f2">Ease of Use</label>
            
                <input type="checkbox" id="f3" name="features[]" value="performance">
                <label for="f3">Performance</label>
            
                <input type="checkbox" id="f4" name="features[]" value="design">
                <label for="f4">Design</label>
            
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Bryan Borst | Product Reviews</p>
    </footer>
</body>

</html>
